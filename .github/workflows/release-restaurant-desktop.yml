# Build + upload Aurent Restaurant installers (SCP only — no docker/nginx).
# Fast path: jar+UI once on Ubuntu; Mac/Win only pack + JRE.
name: Release Restaurant Desktop

on:
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Only build artifacts (no upload to server)'
        required: false
        default: false
        type: boolean
      manifest_only:
        description: 'Only regenerate manifest.json on server (no rebuild)'
        required: false
        default: false
        type: boolean
      mac_targets:
        description: 'Mac DMGs (none = Windows only — fastest)'
        required: false
        default: none
        type: choice
        options:
          - none
          - x64
          - arm64
          - both
  push:
    tags:
      - 'restaurant-desktop-v*'

concurrency:
  group: restaurant-desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REMOTE_DIR: /opt/aurent-pos/downloads/restaurant-desktop
  JRE_CACHE_VER: temurin-17-2026-10

jobs:
  prepare:
    if: ${{ inputs.manifest_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: |
            restaurant-desktop/pnpm-lock.yaml
            restaurant-frontend/pnpm-lock.yaml

      - name: Build jar + UI (no JRE / no electron)
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
          MAVEN_OPTS: -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          mvn -pl restaurant-service -am package -DskipTests -q \
            -Dproject.build.sourceEncoding=UTF-8 \
            -Dproject.reporting.outputEncoding=UTF-8
          JAR="$(ls -1 restaurant-service/target/restaurant-service-*.jar | grep -v plain | head -1)"
          mkdir -p restaurant-desktop/resources
          cp -f "$JAR" restaurant-desktop/resources/restaurant-service.jar
          (cd restaurant-desktop && pnpm install && pnpm run bundle-ui)
          test -f restaurant-desktop/resources/restaurant-service.jar
          test -f restaurant-desktop/ui/index.html
          # Flat payload so Windows/mac download paths are predictable.
          rm -rf /tmp/restaurant-edge-payload
          mkdir -p /tmp/restaurant-edge-payload/resources /tmp/restaurant-edge-payload/ui
          cp -f restaurant-desktop/resources/restaurant-service.jar /tmp/restaurant-edge-payload/resources/
          cp -a restaurant-desktop/ui/. /tmp/restaurant-edge-payload/ui/

      - name: Upload jar + UI
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-edge-payload
          path: /tmp/restaurant-edge-payload
          retention-days: 2

  build-win:
    needs: [prepare]
    if: ${{ inputs.manifest_only != true }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: restaurant-desktop/pnpm-lock.yaml

      - name: Cache portable JRE (win-x64)
        uses: actions/cache@v4
        with:
          path: restaurant-desktop/resources/jre-win-x64
          key: jre-win-x64-${{ env.JRE_CACHE_VER }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ hashFiles('restaurant-desktop/pnpm-lock.yaml') }}

      - name: Download jar + UI
        uses: actions/download-artifact@v4
        with:
          name: restaurant-edge-payload
          path: restaurant-desktop

      - name: Install desktop deps + JRE + build Windows
        working-directory: restaurant-desktop
        shell: bash
        run: |
          set -euo pipefail
          pnpm install
          pnpm add @embedded-postgres/windows-x64@18.4.0-beta.17 --save-optional
          node scripts/sync-pgsql-native.cjs win32 x64
          node scripts/fetch-jre.js --targets win-x64
          node scripts/fetch-vcredist.js
          echo "== payload check =="
          ls -la resources || true
          ls -la ui | head || true
          test -f resources/restaurant-service.jar
          test -f ui/index.html
          test -f resources/jre-win-x64/bin/java.exe
          test -f resources/pgsql/bin/initdb.exe
          test -f resources/vc_redist.x64.exe
          test -f nsis/installer.nsh
          npx electron-builder --win --x64

      - name: Setup SSH
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        shell: bash
        run: |
          chmod +x deploy/*.sh
          bash deploy/server-setup.sh ci-ssh

      - name: Upload Windows installers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST secret missing}"
          : "${DEPLOY_USER:?DEPLOY_USER secret missing}"
          test -f ~/.ssh/deploy_key || { echo "deploy_key missing — Setup SSH failed" >&2; exit 1; }
          ls -la restaurant-desktop/dist || true
          # ssh-keyscan often returns non-zero on CI; must not abort the job
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15)
          ssh "${SSH_OPTS[@]}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${REMOTE_DIR}"
          shopt -s nullglob
          # Only ship the product installer (skip NSIS __uninstaller helper)
          files=(restaurant-desktop/dist/Aurent-Restaurant-*-win-*.exe restaurant-desktop/dist/Aurent-Restaurant-*-win-*.exe.blockmap)
          if ((${#files[@]} == 0)); then
            echo "No Windows artifacts (Aurent-Restaurant-*-win-*.exe)" >&2
            ls -la restaurant-desktop/dist || true
            exit 1
          fi
          echo "Uploading: ${files[*]}"
          scp "${SSH_OPTS[@]}" \
            "${files[@]}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"
          echo "Upload OK"

      - name: Archive Windows installer (Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurent-restaurant-desktop-win-x64
          path: |
            restaurant-desktop/dist/Aurent-Restaurant-*-win-*.exe
            restaurant-desktop/dist/Aurent-Restaurant-*-win-*.exe.blockmap
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key

  build-mac-x64:
    needs: [prepare]
    if: >-
      inputs.manifest_only != true &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mac_targets == 'x64' || inputs.mac_targets == 'both')
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: restaurant-desktop/pnpm-lock.yaml

      - name: Cache portable JRE (mac-x64)
        uses: actions/cache@v4
        with:
          path: restaurant-desktop/resources/jre-mac-x64
          key: jre-mac-x64-${{ env.JRE_CACHE_VER }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-x64-${{ hashFiles('restaurant-desktop/pnpm-lock.yaml') }}

      - name: Download jar + UI
        uses: actions/download-artifact@v4
        with:
          name: restaurant-edge-payload
          path: restaurant-desktop

      - name: Install desktop deps + JRE + build macOS x64
        working-directory: restaurant-desktop
        run: |
          set -euo pipefail
          pnpm install
          pnpm add @embedded-postgres/darwin-x64@18.4.0-beta.17 --save-optional
          node scripts/sync-pgsql-native.cjs darwin x64
          node scripts/fetch-jre.js --targets mac-x64
          echo "== payload check =="
          ls -la resources || true
          ls -la ui | head || true
          test -f resources/restaurant-service.jar
          test -f ui/index.html
          test -f resources/jre-mac-x64/bin/java
          test -f resources/pgsql/bin/initdb
          npx electron-builder --mac --x64 -c.mac.target=dmg

      - name: Setup SSH
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          chmod +x deploy/*.sh
          bash deploy/server-setup.sh ci-ssh

      - name: Upload macOS x64 installers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${REMOTE_DIR}"
          shopt -s nullglob
          files=(restaurant-desktop/dist/*x64*.dmg restaurant-desktop/dist/*x64*.blockmap)
          if ((${#files[@]} == 0)); then
            echo "No macOS x64 artifacts" >&2
            ls -la restaurant-desktop/dist || true
            exit 1
          fi
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${files[@]}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  build-mac-arm64:
    needs: [prepare]
    if: >-
      inputs.manifest_only != true &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mac_targets == 'arm64' || inputs.mac_targets == 'both')
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: restaurant-desktop/pnpm-lock.yaml

      - name: Cache portable JRE (mac-arm64)
        uses: actions/cache@v4
        with:
          path: restaurant-desktop/resources/jre-mac-arm64
          key: jre-mac-arm64-${{ env.JRE_CACHE_VER }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-arm64-${{ hashFiles('restaurant-desktop/pnpm-lock.yaml') }}

      - name: Download jar + UI
        uses: actions/download-artifact@v4
        with:
          name: restaurant-edge-payload
          path: restaurant-desktop

      - name: Install desktop deps + JRE + build macOS arm64
        working-directory: restaurant-desktop
        run: |
          set -euo pipefail
          pnpm install
          pnpm add @embedded-postgres/darwin-arm64@18.4.0-beta.17 --save-optional
          node scripts/sync-pgsql-native.cjs darwin arm64
          node scripts/fetch-jre.js --targets mac-arm64
          echo "== payload check =="
          ls -la resources || true
          ls -la ui | head || true
          test -f resources/restaurant-service.jar
          test -f ui/index.html
          test -f resources/jre-mac-arm64/bin/java
          test -f resources/pgsql/bin/initdb
          npx electron-builder --mac --arm64 -c.mac.target=dmg

      - name: Setup SSH
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          chmod +x deploy/*.sh
          bash deploy/server-setup.sh ci-ssh

      - name: Upload macOS arm64 installers
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${REMOTE_DIR}"
          shopt -s nullglob
          files=(restaurant-desktop/dist/*arm64*.dmg restaurant-desktop/dist/*arm64*.blockmap)
          if ((${#files[@]} == 0)); then
            echo "No macOS arm64 artifacts" >&2
            ls -la restaurant-desktop/dist || true
            exit 1
          fi
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${files[@]}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  publish-manifest:
    needs: [prepare, build-win, build-mac-x64, build-mac-arm64]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_deploy != true) &&
      (inputs.manifest_only == true || needs.prepare.result == 'success') &&
      (inputs.manifest_only == true || needs.build-win.result == 'success') &&
      (inputs.manifest_only == true || needs.build-mac-x64.result == 'success' || needs.build-mac-x64.result == 'skipped') &&
      (inputs.manifest_only == true || needs.build-mac-arm64.result == 'success' || needs.build-mac-arm64.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/restaurant-desktop-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          chmod +x deploy/*.sh
          bash deploy/server-setup.sh ci-ssh

      - name: Pull installers, write manifest, push manifest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p restaurant-desktop/dist
          VERSION="$(node -p "require('./restaurant-desktop/package.json').version")"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/Aurent-Restaurant-${VERSION}-*" \
            restaurant-desktop/dist/ || true
          bash deploy/publish-restaurant-desktop.sh
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            downloads/restaurant-desktop/manifest.json \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/manifest.json"
          echo "Restaurant desktop installers published (static only)"
          cat downloads/restaurant-desktop/manifest.json

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
