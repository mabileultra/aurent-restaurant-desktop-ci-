services:
  postgres:
    image: postgres:15-alpine
    container_name: masterpiece-pos-db
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    ports:
      - "5433:5432"
    volumes:
      - pos_pg_data:/var/lib/postgresql/data
      # Миграции — Liquibase при старте backend (см. web-backend/src/main/resources/db/changelog/).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  finance-db:
    image: postgres:15-alpine
    container_name: masterpiece-finance-db
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
    ports:
      - "5434:5432"
    volumes:
      - finance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: masterpiece-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health 2>/dev/null | grep -q Healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: masterpiece-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    container_name: masterpiece-finance-service
    depends_on:
      finance-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      FINANCE_DB_URL: jdbc:postgresql://finance-db:5432/finance_db
      FINANCE_DB_USERNAME: finance_user
      FINANCE_DB_PASSWORD: finance_password
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      FINANCE_INTERNAL_API_KEY: finance-internal-dev-key-change-in-prod
      FINANCE_SERVER_PORT: "8082"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINANCE_KAFKA_CONSUMER_ENABLED: "true"
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  identity-db:
    image: postgres:15-alpine
    container_name: masterpiece-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_password
    ports:
      - "5435:5432"
    volumes:
      - identity_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: masterpiece-identity-service
    depends_on:
      identity-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://identity-db:5432/identity_db
      IDENTITY_DB_USERNAME: identity_user
      IDENTITY_DB_PASSWORD: identity_password
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      IDENTITY_INTERNAL_API_KEY: identity-internal-dev-key-change-in-prod
      IDENTITY_SERVER_PORT: "8081"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_db
      POS_CORE_DATASOURCE_USERNAME: pos_user
      POS_CORE_DATASOURCE_PASSWORD: pos_password
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  platform-db:
    image: postgres:15-alpine
    container_name: masterpiece-platform-db
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_password
    ports:
      - "5436:5432"
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform-service:
    build:
      context: .
      dockerfile: platform-service/Dockerfile
    container_name: masterpiece-platform-service
    depends_on:
      platform-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PLATFORM_DB_URL: jdbc:postgresql://platform-db:5432/platform_db
      PLATFORM_DB_USERNAME: platform_user
      PLATFORM_DB_PASSWORD: platform_password
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      PLATFORM_INTERNAL_API_KEY: platform-internal-dev-key-change-in-prod
      PLATFORM_SERVER_PORT: "8084"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_db
      POS_CORE_DATASOURCE_USERNAME: pos_user
      POS_CORE_DATASOURCE_PASSWORD: pos_password
      BILLING_UPLOAD_DIR: /app/data/billing-uploads
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - platform_billing_uploads:/app/data/billing-uploads
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  crm-db:
    image: postgres:15-alpine
    container_name: masterpiece-crm-db
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5438:5432"
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  crm-service:
    build:
      context: .
      dockerfile: crm-service/Dockerfile
    container_name: masterpiece-crm-service
    depends_on:
      crm-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      CRM_DB_URL: jdbc:postgresql://crm-db:5432/crm_db
      CRM_DB_USERNAME: crm_user
      CRM_DB_PASSWORD: crm_password
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      CRM_INTERNAL_API_KEY: crm-internal-dev-key-change-in-prod
      CRM_SERVER_PORT: "8083"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_db
      POS_CORE_DATASOURCE_USERNAME: pos_user
      POS_CORE_DATASOURCE_PASSWORD: pos_password
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  restaurant-db:
    image: postgres:15-alpine
    container_name: masterpiece-restaurant-db
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_password
    ports:
      - "5439:5432"
    volumes:
      - restaurant_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  restaurant-service:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    container_name: masterpiece-restaurant-service
    depends_on:
      restaurant-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      RESTAURANT_DB_URL: jdbc:postgresql://restaurant-db:5432/restaurant_db
      RESTAURANT_DB_USERNAME: restaurant_user
      RESTAURANT_DB_PASSWORD: restaurant_password
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      RESTAURANT_SERVER_PORT: "8087"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DOMAIN_KAFKA_ENABLED: "true"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_INTERNAL_API_KEY: pos-internal-dev-key-change-in-prod
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8087/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  pharmacy-db:
    image: postgres:15-alpine
    container_name: masterpiece-pharmacy-db
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: pharmacy_user
      POSTGRES_PASSWORD: pharmacy_password
    ports:
      - "5441:5432"
    volumes:
      - pharmacy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy_user -d pharmacy_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pharmacy-service:
    build:
      context: .
      dockerfile: pharmacy-service/Dockerfile
    container_name: masterpiece-pharmacy-service
    depends_on:
      pharmacy-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PHARMACY_DB_URL: jdbc:postgresql://pharmacy-db:5432/pharmacy_db
      PHARMACY_DB_USERNAME: pharmacy_user
      PHARMACY_DB_PASSWORD: pharmacy_password
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      PHARMACY_SERVER_PORT: "8089"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_INTERNAL_API_KEY: pos-internal-dev-key-change-in-prod
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DOMAIN_KAFKA_ENABLED: "true"
      POS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pos_db
      POS_CORE_DATASOURCE_USERNAME: pos_user
      POS_CORE_DATASOURCE_PASSWORD: pos_password
      PHARMACY_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  reporting-db:
    image: postgres:15-alpine
    container_name: masterpiece-reporting-db
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: reporting_user
      POSTGRES_PASSWORD: reporting_password
    ports:
      - "5437:5432"
    volumes:
      - reporting_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting_user -d reporting_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  reporting-service:
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    container_name: masterpiece-reporting-service
    depends_on:
      reporting-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      REPORTING_DB_URL: jdbc:postgresql://reporting-db:5432/reporting_db
      REPORTING_DB_USERNAME: reporting_user
      REPORTING_DB_PASSWORD: reporting_password
      REPORTING_SERVER_PORT: "8085"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REPORTING_KAFKA_CONSUMER_ENABLED: "true"
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      REPORTING_INTERNAL_API_KEY: reporting-internal-dev-key-change-in-prod
      POS_CORE_URL: http://backend:8080/api/v1
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: masterpiece-ai-service
    depends_on:
      reporting-service:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      AI_SERVER_PORT: "8086"
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      REPORTING_SERVICE_URL: http://reporting-service:8085/api/v1
      POS_CORE_URL: http://backend:8080/api/v1
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-true}
      AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-deepseek}
      AI_ASSISTANT_BASE_URL: ${AI_ASSISTANT_BASE_URL:-https://api.deepseek.com}
      AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-deepseek-chat}
      AI_ASSISTANT_API_KEY: ${AI_ASSISTANT_API_KEY:-}
      AI_ASSISTANT_CONNECT_TIMEOUT_MS: "5000"
      AI_ASSISTANT_READ_TIMEOUT_MS: "20000"
      AI_ASSISTANT_MAX_PROMPT_CHARS: "2000"
      AI_ASSISTANT_MAX_RPM_PER_USER: "20"
      AI_ASSISTANT_FAST_MODE: ${AI_ASSISTANT_FAST_MODE:-true}
      AI_ASSISTANT_MAX_TOKENS_INSIGHT: "550"
      AI_ASSISTANT_MAX_TOKENS_GENERAL: "700"
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  backend:
    build:
      context: .
      dockerfile: web-backend/Dockerfile
    container_name: masterpiece-pos-backend
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      # local — Swagger включён (см. application-local.yml). Prod: docker-compose.prod.yml
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/pos_db
      DB_USERNAME: pos_user
      DB_PASSWORD: pos_password
      JWT_SECRET: change-me-use-at-least-32-chars-for-hs256!!
      GATEWAY_CONTEXT_SECRET: gateway-context-dev-secret-not-for-prod!!
      MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      FINANCE_SERVICE_URL: http://finance-service:8082/api/v1
      FINANCE_INTERNAL_API_KEY: finance-internal-dev-key-change-in-prod
      IDENTITY_INTERNAL_API_KEY: identity-internal-dev-key-change-in-prod
      IDENTITY_SERVICE_URL: http://identity-service:8081/api/v1
      PLATFORM_INTERNAL_API_KEY: platform-internal-dev-key-change-in-prod
      PLATFORM_SERVICE_URL: http://platform-service:8084/api/v1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINANCE_KAFKA_ENABLED: "true"
      DOMAIN_KAFKA_ENABLED: "true"
      REPORTING_INTERNAL_API_KEY: reporting-internal-dev-key-change-in-prod
      REPORTING_SERVICE_URL: http://reporting-service:8085/api/v1
      CRM_INTERNAL_API_KEY: crm-internal-dev-key-change-in-prod
      CRM_SERVICE_URL: http://crm-service:8083/api/v1
      POS_INTERNAL_API_KEY: pos-internal-dev-key-change-in-prod
      TZ: ${TZ:-Asia/Tashkent}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: masterpiece-api-gateway
    depends_on:
      backend:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      pharmacy-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      GATEWAY_SERVER_PORT: "8080"
      POS_BACKEND_URL: http://backend:8080
      FINANCE_SERVICE_URL: http://finance-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PLATFORM_SERVICE_URL: http://platform-service:8084
      REPORTING_SERVICE_URL: http://reporting-service:8085
      CRM_SERVICE_URL: http://crm-service:8083
      RESTAURANT_SERVICE_URL: http://restaurant-service:8087
      PHARMACY_SERVICE_URL: http://pharmacy-service:8089
      AI_SERVICE_URL: http://ai-service:8086
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: masterpiece-pos-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5173:80"
    volumes:
      - ./downloads:/var/downloads:ro

volumes:
  pos_pg_data:
  finance_pg_data:
  identity_pg_data:
  platform_pg_data:
  platform_billing_uploads:
  reporting_pg_data:
  crm_pg_data:
  restaurant_pg_data:
  pharmacy_pg_data:
