<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internet bilan aloqa uzildi — Aurent</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0c1018" />
    <style>
      :root {
        --bg-color: #0c1018;
        --card-bg: #141a23;
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-amber: #f59e0b;
        --accent-emerald: #10b981;
        --btn-bg: #10b981;
        --btn-hover: #059669;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-color: #f1f5f9;
          --card-bg: #ffffff;
          --border-color: rgba(0, 0, 0, 0.08);
          --text-primary: #0f172a;
          --text-secondary: #64748b;
          --btn-bg: #059669;
          --btn-hover: #047857;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .offline-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.02em;
        margin-bottom: 24px;
        color: var(--text-primary);
        opacity: 0.9;
      }
      .icon-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-amber);
        margin-bottom: 24px;
      }
      .icon-pulse {
        position: absolute;
        inset: -6px;
        border-radius: 26px;
        border: 2px solid rgba(245, 158, 11, 0.3);
        animation: pulse 2.5s infinite;
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.8;
        }
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        color: var(--text-primary);
      }
      p.desc-uz {
        font-size: 14.5px;
        line-height: 1.55;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      p.desc-ru {
        font-size: 13px;
        line-height: 1.45;
        color: var(--text-secondary);
        opacity: 0.8;
        margin-bottom: 28px;
      }
      .btn-retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 48px;
        padding: 12px 24px;
        background-color: var(--btn-bg);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        touch-action: manipulation;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
      }
      .btn-retry:hover {
        background-color: var(--btn-hover);
        transform: translateY(-1px);
      }
      .btn-retry:active {
        transform: scale(0.98);
      }
      .btn-retry.reconnected {
        background-color: var(--accent-emerald);
      }
      .status-hint {
        margin-top: 18px;
        font-size: 12.5px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: var(--accent-amber);
        display: inline-block;
        animation: blink 1.5s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="offline-card" role="alert" aria-live="assertive">
      <div class="brand-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span>AURENT</span>
      </div>

      <div class="icon-wrapper">
        <div class="icon-pulse"></div>
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>Internet bilan aloqa uzildi</h1>
      <p class="desc-uz">Qurilmangiz internet tarmog'iga ulanmagan. Iltimos, Wi-Fi yoki tarmoq kabeli ulanishini tekshiring.</p>
      <p class="desc-ru">Нет подключения к интернету. Проверьте Wi-Fi или сетевой кабель.</p>

      <button id="retry-btn" class="btn-retry" type="button" onclick="handleRetry()">
        <span class="spinner" id="retry-spinner"></span>
        <svg id="retry-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        <span id="retry-text">Qayta tekshirish</span>
      </button>

      <div class="status-hint">
        <span class="status-dot"></span>
        <span>Aloqa tiklanganda sahifa avtomatik ochiladi</span>
      </div>
    </div>

    <script>
      var isRetrying = false;

      function handleRetry() {
        if (isRetrying) return;
        isRetrying = true;
        var btn = document.getElementById('retry-btn');
        var spinner = document.getElementById('retry-spinner');
        var icon = document.getElementById('retry-icon');
        var text = document.getElementById('retry-text');

        if (spinner) spinner.style.display = 'inline-block';
        if (icon) icon.style.display = 'none';
        if (text) text.textContent = 'Tekshirilmoqda…';

        probeOnline().then(function (ok) {
          if (ok) {
            if (text) text.textContent = 'Aloqa tiklandi!';
            if (btn) btn.classList.add('reconnected');
            setTimeout(function () {
              window.location.reload();
            }, 400);
          } else {
            setTimeout(function () {
              isRetrying = false;
              if (spinner) spinner.style.display = 'none';
              if (icon) icon.style.display = 'inline-block';
              if (text) text.textContent = 'Qayta tekshirish';
            }, 1000);
          }
        });
      }

      function probeOnline() {
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          return Promise.resolve(false);
        }
        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timeoutId = setTimeout(function () {
          if (controller) controller.abort();
        }, 3500);

        return fetch('/favicon.svg?_t=' + Date.now(), {
          method: 'HEAD',
          cache: 'no-store',
          signal: controller ? controller.signal : undefined,
        })
          .then(function (res) {
            clearTimeout(timeoutId);
            return Boolean(res && res.status > 0);
          })
          .catch(function () {
            clearTimeout(timeoutId);
            return false;
          });
      }

      // Automatically reload when browser reports online
      window.addEventListener('online', function () {
        probeOnline().then(function (ok) {
          if (ok) window.location.reload();
        });
      });

      // Background periodic check every 3 seconds
      setInterval(function () {
        if (isRetrying) return;
        if (navigator.onLine) {
          probeOnline().then(function (ok) {
            if (ok) window.location.reload();
          });
        }
      }, 3000);
    </script>
  </body>
</html>
