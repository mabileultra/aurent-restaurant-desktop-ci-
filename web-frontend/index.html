<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1018" />
    <style>
      html.cashier-theme--dark,
      html.cashier-theme--dark body {
        background-color: #0c1018;
      }
      html.cashier-theme--light,
      html.cashier-theme--light body {
        background-color: #e9eef4;
      }
    </style>
    <script>
      (function () {
        try {
          document.documentElement.classList.remove('dark');
          var isCashier = location.pathname.indexOf('/cashier') === 0;
          var cashierTheme = 'dark';
          if (isCashier) {
            cashierTheme = localStorage.getItem('pos-cashier-theme');
            if (cashierTheme !== 'light' && cashierTheme !== 'dark') cashierTheme = 'dark';
            document.documentElement.classList.remove('cashier-theme--light', 'cashier-theme--dark');
            document.documentElement.classList.add(
              cashierTheme === 'light' ? 'cashier-theme--light' : 'cashier-theme--dark',
              'app-theme--cashier'
            );
            document.documentElement.classList.remove('app-theme--admin');
          }
          if (isCashier) {
            var bg = cashierTheme === 'light' ? '#e9eef4' : '#0c1018';
            document.documentElement.style.backgroundColor = bg;
            document.addEventListener('DOMContentLoaded', function () {
              document.body.style.backgroundColor = bg;
            });
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', bg);
          } else {
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.add('app-theme--admin');
            localStorage.removeItem('pos-theme');
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>Aurent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
