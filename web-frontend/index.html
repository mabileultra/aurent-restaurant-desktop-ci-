<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1018" />
    <style>
      html.cashier-theme--dark,
      html.cashier-theme--dark body {
        background-color: #0c1018;
      }
      html.cashier-theme--light,
      html.cashier-theme--light body {
        background-color: #e9eef4;
      }
    </style>
    <script>
      (function () {
        try {
          var isCashier = location.pathname.indexOf('/cashier') === 0;
          var isRst = location.pathname.indexOf('/rst') === 0;
          var isCashierLogin = location.pathname.indexOf('/cashier/login') === 0;
          var cashierTheme = 'dark';
          if (isCashier) {
            document.documentElement.classList.remove('dark');
            cashierTheme = localStorage.getItem('pos-cashier-theme');
            if (cashierTheme !== 'light' && cashierTheme !== 'dark') cashierTheme = 'dark';
            /* PIN-логин всегда светлый — иначе чёрный экран до монтирования React */
            if (isCashierLogin) cashierTheme = 'light';
            document.documentElement.classList.remove('cashier-theme--light', 'cashier-theme--dark');
            document.documentElement.classList.add(
              cashierTheme === 'light' ? 'cashier-theme--light' : 'cashier-theme--dark',
              'app-theme--cashier'
            );
            document.documentElement.classList.remove('app-theme--admin');
            var bg = isCashierLogin ? '#f8fafc' : cashierTheme === 'light' ? '#e9eef4' : '#0c1018';
            document.documentElement.style.backgroundColor = bg;
            document.addEventListener('DOMContentLoaded', function () {
              document.body.style.backgroundColor = bg;
            });
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', bg);
          } else if (isRst) {
            document.documentElement.classList.add('dark', 'rst-theme');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.style.backgroundColor = '#121418';
          } else {
            var adminTheme = localStorage.getItem('app-admin-theme') || 'light';
            var isDark = adminTheme === 'dark' || (adminTheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.classList.add('dark', 'app-theme--admin');
              document.documentElement.style.colorScheme = 'dark';
              document.documentElement.style.backgroundColor = '#0b1210';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('app-theme--admin');
              document.documentElement.style.colorScheme = 'light';
              document.documentElement.style.backgroundColor = '#f1f5f9';
            }
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>Aurent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
