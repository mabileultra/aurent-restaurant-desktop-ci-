server:
  port: ${REPORTING_SERVER_PORT:8085}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: reporting-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: reporting-service
      auto-offset-reset: earliest
  datasource:
    url: ${REPORTING_DB_URL:jdbc:postgresql://localhost:5437/reporting_db}
    username: ${REPORTING_DB_USERNAME:reporting_user}
    password: ${REPORTING_DB_PASSWORD:reporting_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-32-chars-for-hs256!!}
  gateway:
    context-secret: ${GATEWAY_CONTEXT_SECRET:}
  internal:
    api-key: ${REPORTING_INTERNAL_API_KEY:reporting-internal-dev-key-change-in-prod}
  pos-core:
    url: ${POS_CORE_URL:http://localhost:8080/api/v1}
    connect-timeout-ms: ${POS_CORE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${POS_CORE_READ_TIMEOUT_MS:15000}
  kafka:
    consumer:
      enabled: ${REPORTING_KAFKA_CONSUMER_ENABLED:true}

resilience4j:
  circuitbreaker:
    instances:
      pos-core:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      pos-core:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.pos.reporting: INFO
