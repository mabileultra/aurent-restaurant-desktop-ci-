      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      PHARMACY_REDIS_DB: ${PHARMACY_REDIS_DB:-0}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8089:8089'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8089/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: aurent-ai-service
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      reporting-service:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      AI_SERVER_PORT: "8086"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      GATEWAY_CONTEXT_SECRET: ${GATEWAY_CONTEXT_SECRET:-}
      REPORTING_SERVICE_URL: http://reporting-service:8085/api/v1
      POS_CORE_URL: http://backend:8080/api/v1
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-true}
      AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-deepseek}
      AI_ASSISTANT_BASE_URL: ${AI_ASSISTANT_BASE_URL:-https://api.deepseek.com}
      AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-deepseek-chat}
      AI_ASSISTANT_API_KEY: ${AI_ASSISTANT_API_KEY:-}
      AI_ASSISTANT_MAX_PROMPT_CHARS: ${AI_ASSISTANT_MAX_PROMPT_CHARS:-2000}
      AI_ASSISTANT_FAST_MODE: ${AI_ASSISTANT_FAST_MODE:-true}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8086:8086'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8086/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  backend:
    build:
      context: .
      dockerfile: web-backend/Dockerfile
    container_name: aurent-pos-backend
    mem_limit: 1152m
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      DB_USERNAME: ${POSTGRES_USER:-pos_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      GATEWAY_CONTEXT_SECRET: ${GATEWAY_CONTEXT_SECRET:-}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-https://aurent.uz,https://www.aurent.uz,https://r-aurent.uz,https://www.r-aurent.uz,http://localhost:*,http://127.0.0.1:*}
      ORDERS_UPLOAD_DIR: /app/uploads/orders
      LOG_PATH: /app/logs
      TZ: ${TZ:-Asia/Tashkent}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Aurent POS}
      MAIL_LOGIN_URL: ${MAIL_LOGIN_URL:-}
      MAIL_SUPER_ADMIN_LOGIN_RECIPIENTS: ${MAIL_SUPER_ADMIN_LOGIN_RECIPIENTS:-aripov1219@gmail.com,maxmudov71707@gmail.com}
      MAIL_SEND_CREDENTIALS_ON_CREATE: ${MAIL_SEND_CREDENTIALS_ON_CREATE:-true}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      FINANCE_SERVICE_ENABLED: ${FINANCE_SERVICE_ENABLED:-true}
      FINANCE_SERVICE_URL: http://finance-service:8082/api/v1
      FINANCE_INTERNAL_API_KEY: ${FINANCE_INTERNAL_API_KEY:?Set FINANCE_INTERNAL_API_KEY in .env}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:?Set IDENTITY_INTERNAL_API_KEY in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081/api/v1
      PLATFORM_INTERNAL_API_KEY: ${PLATFORM_INTERNAL_API_KEY:?Set PLATFORM_INTERNAL_API_KEY in .env}
      PLATFORM_SERVICE_URL: http://platform-service:8084/api/v1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINANCE_KAFKA_ENABLED: ${FINANCE_KAFKA_ENABLED:-true}
      DOMAIN_KAFKA_ENABLED: ${DOMAIN_KAFKA_ENABLED:-true}
      REPORTING_INTERNAL_API_KEY: ${REPORTING_INTERNAL_API_KEY:?Set REPORTING_INTERNAL_API_KEY in .env}
      REPORTING_SERVICE_URL: http://reporting-service:8085/api/v1
      CRM_INTERNAL_API_KEY: ${CRM_INTERNAL_API_KEY:?Set CRM_INTERNAL_API_KEY in .env}
      CRM_SERVICE_URL: http://crm-service:8083/api/v1
      POS_INTERNAL_API_KEY: ${POS_INTERNAL_API_KEY:-pos-internal-dev-key-change-in-prod}
      TELEGRAM_BOT_API_TOKEN: ${TELEGRAM_BOT_API_TOKEN:-}
      TELEGRAM_BOT_COMPANY_ID: ${TELEGRAM_BOT_COMPANY_ID:-}
      TELEGRAM_BOT_RUNTIME_TOKEN: ${TELEGRAM_BOT_RUNTIME_TOKEN:-}
      MARKING_VALIDATION_USERNAME: ${MARKING_VALIDATION_USERNAME:-}
      MARKING_VALIDATION_PASSWORD: ${MARKING_VALIDATION_PASSWORD:-}
      TELEGRAM_BOT_MAX_RESULTS: ${TELEGRAM_BOT_MAX_RESULTS:-10}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_TELEGRAM_BOT: ${SUPPORT_TELEGRAM_BOT:-}
      VITE_SUPPORT_PHONE: ${VITE_SUPPORT_PHONE:-}
      VITE_SUPPORT_TELEGRAM_BOT: ${VITE_SUPPORT_TELEGRAM_BOT:-}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-25}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-8}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-100}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      OPS_BACKUP_DIR: /ops/backups
      OPS_DISK_CHECK_PATH: /ops/backups
      OPS_ALERT_DISK_WARN_PERCENT: ${OPS_ALERT_DISK_WARN_PERCENT:-85}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ${BACKUP_HOST_DIR:-./backups/postgres}:/ops/backups:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - pos-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: aurent-api-gateway
    # Peak POS fan-in (menu/floor polls) — 640m OOM'd under cashiers2k
    mem_limit: 896m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
      crm-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      pharmacy-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      GATEWAY_SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      GATEWAY_CONTEXT_SECRET: ${GATEWAY_CONTEXT_SECRET:-}
      POS_BACKEND_URL: http://backend:8080
      FINANCE_SERVICE_URL: http://finance-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PLATFORM_SERVICE_URL: http://platform-service:8084
      REPORTING_SERVICE_URL: http://reporting-service:8085
      CRM_SERVICE_URL: http://crm-service:8083
      RESTAURANT_SERVICE_URL: http://restaurant-service:8087
      PHARMACY_SERVICE_URL: http://pharmacy-service:8089
      AI_SERVICE_URL: http://ai-service:8086
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '${API_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pos-net

  frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SUPPORT_PHONE: ${VITE_SUPPORT_PHONE:-}
        VITE_SUPPORT_TELEGRAM_BOT: ${VITE_SUPPORT_TELEGRAM_BOT:-}
        VITE_RESTAURANT_APP_URL: ${VITE_RESTAURANT_APP_URL:-https://r-aurent.uz}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.05}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    container_name: aurent-pos-frontend
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./downloads:/var/downloads:ro
    networks:
      - pos-net

  restaurant-frontend:
    build:
      context: ./restaurant-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_MAIN_APP_URL: ${VITE_MAIN_APP_URL:-https://aurent.uz}
    container_name: aurent-restaurant-frontend
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - '${RESTAURANT_HTTP_PORT:-5174}:80'
    volumes:
      - ./downloads:/var/downloads:ro
    networks:
      - pos-net

  # Аптечный бот: поиск лекарств + поддержка аптеки
  telegram-support-bot:
    build:
      context: ./telegram-support-bot
      dockerfile: Dockerfile
    container_name: aurent-pharmacy-telegram-bot
    mem_limit: 96m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_RUNTIME_TOKEN: ${TELEGRAM_BOT_RUNTIME_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_COMPANY_ID: ${TELEGRAM_BOT_COMPANY_ID:-}
      TELEGRAM_SUPPORT_GROUP_ID: ${TELEGRAM_SUPPORT_GROUP_ID:-}
      TELEGRAM_BOT_API_TOKEN: ${TELEGRAM_BOT_API_TOKEN:-}
      TELEGRAM_BOT_BACKEND_URL: ${TELEGRAM_BOT_BACKEND_URL:-http://backend:8080/api/v1}
      TELEGRAM_BOT_DATA_DIR: /app/data
      TELEGRAM_BOTS: ${TELEGRAM_BOTS:-}
      TZ: ${TZ:-Asia/Tashkent}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - telegram_bot_data:/app/data
    networks:
      - pos-net

  # Бот поддержки веб-приложения (страница «Поддержка» в CRM/POS)
  telegram-web-support-bot:
    build:
      context: ./telegram-web-support-bot
      dockerfile: Dockerfile
    container_name: aurent-web-support-telegram-bot
    mem_limit: 96m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_WEB_SUPPORT_BOT_TOKEN: ${TELEGRAM_WEB_SUPPORT_BOT_TOKEN:-}
      TELEGRAM_WEB_SUPPORT_GROUP_ID: ${TELEGRAM_WEB_SUPPORT_GROUP_ID:-}
      TELEGRAM_WEB_SUPPORT_DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - telegram_web_support_data:/app/data
    networks:
      - pos-net

networks:
  pos-net:
    driver: bridge

volumes:
  pos_pg_data:
  finance_pg_data:
  identity_pg_data:
  platform_pg_data:
  platform_billing_uploads:
  reporting_pg_data:
  crm_pg_data:
  restaurant_pg_data:
  pharmacy_pg_data:
  redpanda_data:
  redis_data:
  backend_uploads:
  backend_logs:
  telegram_bot_data:
  telegram_web_support_data:
