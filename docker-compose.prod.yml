# Production stack — запуск на Ubuntu-сервере:
#   cp .env.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: aurent-pos-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=768MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_db}
      POSTGRES_USER: ${POSTGRES_USER:-pos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - pos_pg_data:/var/lib/postgresql/data
      # Схема и миграции — только Liquibase при старте backend (db/changelog/).
      # Не монтируйте SQL в docker-entrypoint-initdb.d — иначе три источника правды.
    ports:
      # Только localhost сервера — для DBeaver/DataGrip через SSH (не в интернет)
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pos_user} -d ${POSTGRES_DB:-pos_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos-net

  finance-db:
    image: postgres:15-alpine
    container_name: aurent-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FINANCE_DB_NAME:-finance_db}
      POSTGRES_USER: ${FINANCE_DB_USER:-finance_user}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - finance_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FINANCE_DB_USER:-finance_user} -d ${FINANCE_DB_NAME:-finance_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos-net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: aurent-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - '127.0.0.1:19092:19092'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health 2>/dev/null | grep -q Healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    container_name: aurent-finance-service
    restart: unless-stopped
    depends_on:
      finance-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      FINANCE_DB_URL: jdbc:postgresql://finance-db:5432/${FINANCE_DB_NAME:-finance_db}
      FINANCE_DB_USERNAME: ${FINANCE_DB_USER:-finance_user}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      FINANCE_INTERNAL_API_KEY: ${FINANCE_INTERNAL_API_KEY:?Set FINANCE_INTERNAL_API_KEY in .env}
      FINANCE_SERVER_PORT: "8082"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINANCE_KAFKA_CONSUMER_ENABLED: ${FINANCE_KAFKA_ENABLED:-true}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8082:8082'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8082/api/v1/swagger-ui.html >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  identity-db:
    image: postgres:15-alpine
    container_name: aurent-identity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity_user}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - identity_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5436:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${IDENTITY_DB_USER:-identity_user} -d ${IDENTITY_DB_NAME:-identity_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos-net

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: aurent-identity-service
    restart: unless-stopped
    depends_on:
      identity-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://identity-db:5432/${IDENTITY_DB_NAME:-identity_db}
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USER:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:?Set IDENTITY_INTERNAL_API_KEY in .env}
      IDENTITY_SERVER_PORT: "8081"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      POS_CORE_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos_user}
      POS_CORE_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8081/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  platform-db:
    image: postgres:15-alpine
    container_name: aurent-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME:-platform_db}
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform_user}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - platform_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5437:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PLATFORM_DB_USER:-platform_user} -d ${PLATFORM_DB_NAME:-platform_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos-net

  platform-service:
    build:
      context: .
      dockerfile: platform-service/Dockerfile
    container_name: aurent-platform-service
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      PLATFORM_DB_URL: jdbc:postgresql://platform-db:5432/${PLATFORM_DB_NAME:-platform_db}
      PLATFORM_DB_USERNAME: ${PLATFORM_DB_USER:-platform_user}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      PLATFORM_INTERNAL_API_KEY: ${PLATFORM_INTERNAL_API_KEY:?Set PLATFORM_INTERNAL_API_KEY in .env}
      PLATFORM_SERVER_PORT: "8084"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      POS_CORE_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos_user}
      POS_CORE_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8084:8084'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8084/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  reporting-db:
    image: postgres:15-alpine
    container_name: aurent-reporting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REPORTING_DB_NAME:-reporting_db}
      POSTGRES_USER: ${REPORTING_DB_USER:-reporting_user}
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - reporting_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5438:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${REPORTING_DB_USER:-reporting_user} -d ${REPORTING_DB_NAME:-reporting_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos-net

  reporting-service:
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    container_name: aurent-reporting-service
    restart: unless-stopped
    depends_on:
      reporting-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      REPORTING_DB_URL: jdbc:postgresql://reporting-db:5432/${REPORTING_DB_NAME:-reporting_db}
      REPORTING_DB_USERNAME: ${REPORTING_DB_USER:-reporting_user}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env}
      REPORTING_SERVER_PORT: "8085"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      REPORTING_KAFKA_CONSUMER_ENABLED: ${REPORTING_KAFKA_CONSUMER_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      REPORTING_INTERNAL_API_KEY: ${REPORTING_INTERNAL_API_KEY:?Set REPORTING_INTERNAL_API_KEY in .env}
      POS_CORE_URL: http://backend:8080/api/v1
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8085:8085'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8085/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  backend:
    build:
      context: .
      dockerfile: web-backend/Dockerfile
    container_name: aurent-pos-backend
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      DB_USERNAME: ${POSTGRES_USER:-pos_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      ORDERS_UPLOAD_DIR: /app/uploads/orders
      LOG_PATH: /app/logs
      TZ: ${TZ:-Asia/Tashkent}
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-true}
      AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-deepseek}
      AI_ASSISTANT_BASE_URL: ${AI_ASSISTANT_BASE_URL:-https://api.deepseek.com}
      AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-deepseek-chat}
      AI_ASSISTANT_API_KEY: ${AI_ASSISTANT_API_KEY:-}
      AI_ASSISTANT_MAX_PROMPT_CHARS: ${AI_ASSISTANT_MAX_PROMPT_CHARS:-2000}
      AI_ASSISTANT_FAST_MODE: ${AI_ASSISTANT_FAST_MODE:-true}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Aurent POS}
      MAIL_LOGIN_URL: ${MAIL_LOGIN_URL:-}
      MAIL_SUPER_ADMIN_LOGIN_RECIPIENTS: ${MAIL_SUPER_ADMIN_LOGIN_RECIPIENTS:-aripov1219@gmail.com,maxmudov71707@gmail.com}
      MAIL_SEND_CREDENTIALS_ON_CREATE: ${MAIL_SEND_CREDENTIALS_ON_CREATE:-true}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      FINANCE_SERVICE_ENABLED: ${FINANCE_SERVICE_ENABLED:-true}
      FINANCE_SERVICE_URL: http://finance-service:8082/api/v1
      FINANCE_INTERNAL_API_KEY: ${FINANCE_INTERNAL_API_KEY:?Set FINANCE_INTERNAL_API_KEY in .env}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:?Set IDENTITY_INTERNAL_API_KEY in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081/api/v1
      PLATFORM_INTERNAL_API_KEY: ${PLATFORM_INTERNAL_API_KEY:?Set PLATFORM_INTERNAL_API_KEY in .env}
      PLATFORM_SERVICE_URL: http://platform-service:8084/api/v1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINANCE_KAFKA_ENABLED: ${FINANCE_KAFKA_ENABLED:-true}
      DOMAIN_KAFKA_ENABLED: ${DOMAIN_KAFKA_ENABLED:-true}
      REPORTING_INTERNAL_API_KEY: ${REPORTING_INTERNAL_API_KEY:?Set REPORTING_INTERNAL_API_KEY in .env}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-25}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-8}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-100}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - pos-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: aurent-api-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    environment:
      GATEWAY_SERVER_PORT: "8080"
      POS_BACKEND_URL: http://backend:8080
      FINANCE_SERVICE_URL: http://finance-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      PLATFORM_SERVICE_URL: http://platform-service:8084
      REPORTING_SERVICE_URL: http://reporting-service:8085/api/v1
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '${API_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pos-net

  frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SUPPORT_PHONE: ${VITE_SUPPORT_PHONE:-}
        VITE_SUPPORT_TELEGRAM_BOT: ${VITE_SUPPORT_TELEGRAM_BOT:-}
    container_name: aurent-pos-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./downloads:/var/downloads:ro
    networks:
      - pos-net

  telegram-support-bot:
    build:
      context: ./telegram-support-bot
      dockerfile: Dockerfile
    container_name: aurent-pos-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_SUPPORT_GROUP_ID: ${TELEGRAM_SUPPORT_GROUP_ID:-}
      TZ: ${TZ:-Asia/Tashkent}
    networks:
      - pos-net

networks:
  pos-net:
    driver: bridge

volumes:
  pos_pg_data:
  finance_pg_data:
  identity_pg_data:
  platform_pg_data:
  reporting_pg_data:
  backend_uploads:
  backend_logs:
