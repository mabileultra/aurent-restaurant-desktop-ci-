# Production stack — запуск на Ubuntu-сервере:
#   cp .env.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: aurent-pos-db
    mem_limit: 384m
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=768MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_db}
      POSTGRES_USER: ${POSTGRES_USER:-pos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - pos_pg_data:/var/lib/postgresql/data
      # Схема и миграции — только Liquibase при старте backend (db/changelog/).
      # Не монтируйте SQL в docker-entrypoint-initdb.d — иначе три источника правды.
    ports:
      # Только localhost сервера — для DBeaver/DataGrip через SSH (не в интернет)
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pos_user} -d ${POSTGRES_DB:-pos_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos-net

  finance-db:
    image: postgres:15-alpine
    container_name: aurent-finance-db
    mem_limit: 192m
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FINANCE_DB_NAME:-finance_db}
      POSTGRES_USER: ${FINANCE_DB_USER:-finance_user}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - finance_pg_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FINANCE_DB_USER:-finance_user} -d ${FINANCE_DB_NAME:-finance_db}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pos-net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: aurent-redpanda
    mem_limit: 640m
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
      - --smp ${REDPANDA_SMP:-2}
      - --memory ${REDPANDA_MEMORY:-512M}
      - --overprovisioned
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - '127.0.0.1:19092:19092'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health 2>/dev/null | grep -q Healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  redis:
    image: redis:7-alpine
    container_name: aurent-redis
    # ~2k POS: menu/floor cache across restaurant (+ pharmacy)
    mem_limit: 256m
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'no'
      - --save
      - ''
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks:
      - pos-net

  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    container_name: aurent-finance-service
    mem_limit: 768m
    restart: unless-stopped
    depends_on:
      finance-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      FINANCE_DB_URL: jdbc:postgresql://finance-db:5432/${FINANCE_DB_NAME:-finance_db}
      FINANCE_DB_USERNAME: ${FINANCE_DB_USER:-finance_user}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      GATEWAY_CONTEXT_SECRET: ${GATEWAY_CONTEXT_SECRET:-}
      FINANCE_INTERNAL_API_KEY: ${FINANCE_INTERNAL_API_KEY:?Set FINANCE_INTERNAL_API_KEY in .env}
      FINANCE_SERVER_PORT: "8082"
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-https://aurent.uz,https://www.aurent.uz,https://r-aurent.uz,https://www.r-aurent.uz,http://localhost:*,http://127.0.0.1:*}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINANCE_KAFKA_CONSUMER_ENABLED: ${FINANCE_KAFKA_ENABLED:-true}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8082:8082'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8082/api/v1/actuator/health | grep -q UP || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

