      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USER:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      GATEWAY_CONTEXT_SECRET: ${GATEWAY_CONTEXT_SECRET:-}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:?Set IDENTITY_INTERNAL_API_KEY in .env}
      IDENTITY_SERVER_PORT: "8081"
      POS_CORE_URL: http://backend:8080/api/v1
      POS_CORE_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      POS_CORE_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos_user}
      POS_CORE_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-15}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8081/api/v1/actuator/health | grep -q UP || exit 1']
