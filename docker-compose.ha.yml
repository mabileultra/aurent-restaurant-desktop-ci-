# HA overlay — scale POS core backend behind a single api-gateway (Docker DNS RR).
# Usage:
#   HA=1 BACKEND_REPLICAS=2 bash scripts/ha-up.sh
#   # or:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ha.yml --env-file .env \
#     up -d --scale backend=${BACKEND_REPLICAS:-2} --no-recreate redpanda
#
# Notes:
# - api-gateway stays single (publishes API_PORT); it round-robins http://backend:8080
# - container_name removed for backend so --scale works
# - set KAFKA_BOOTSTRAP_SERVERS to external cluster when ready (Redpanda keeps working)

services:
  backend:
    container_name: !reset null
    environment:
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-20}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-6}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-120}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}

  api-gateway:
    environment:
      # Docker Compose DNS returns all backend replica IPs — RR across instances
      POS_BACKEND_URL: http://backend:8080

  redpanda:
    environment:
      # Keep bootstrap overridable for managed Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
