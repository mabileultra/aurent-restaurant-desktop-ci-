server:
  port: ${AI_SERVER_PORT:8086}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ai-service

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-32-chars-for-hs256!!}
  reporting:
    url: ${REPORTING_SERVICE_URL:http://localhost:8085/api/v1}
  pos-core:
    url: ${POS_CORE_URL:http://localhost:8080/api/v1}
  ai:
    enabled: ${AI_ASSISTANT_ENABLED:true}
    provider: ${AI_ASSISTANT_PROVIDER:deepseek}
    base-url: ${AI_ASSISTANT_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_ASSISTANT_API_KEY:}
    model: ${AI_ASSISTANT_MODEL:deepseek-chat}
    connect-timeout-ms: ${AI_ASSISTANT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_ASSISTANT_READ_TIMEOUT_MS:20000}
    max-prompt-chars: ${AI_ASSISTANT_MAX_PROMPT_CHARS:2000}
    max-requests-per-minute-per-user: ${AI_ASSISTANT_MAX_RPM_PER_USER:20}
    fast-mode: ${AI_ASSISTANT_FAST_MODE:true}
    max-tokens-insight: ${AI_ASSISTANT_MAX_TOKENS_INSIGHT:550}
    max-tokens-general-chat: ${AI_ASSISTANT_MAX_TOKENS_GENERAL:700}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      reporting-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      pos-core-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      reporting-service:
        maxAttempts: 2
        waitDuration: 500ms
      pos-core-service:
        maxAttempts: 2
        waitDuration: 500ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
