<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurent Restaurant</title>
  <style>
    :root {
      --bg0: #0b1220;
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --err: #fca5a5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg0);
      color: var(--text);
    }
    .boot-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--bg0);
    }
    .boot-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .boot-bg.is-hidden { display: none; }
    .boot-scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(11, 18, 32, 0.25) 0%, rgba(11, 18, 32, 0.72) 100%),
        linear-gradient(180deg, rgba(11, 18, 32, 0.35) 0%, rgba(11, 18, 32, 0.15) 40%, rgba(11, 18, 32, 0.75) 100%);
    }
    .wrap {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem 2rem 5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }
    #msg {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      max-width: 28rem;
      line-height: 1.45;
      min-height: 1.45em;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
    }
    .boot-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 2rem;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      pointer-events: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(148, 163, 184, 0.28);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner.is-hidden { display: none; }
    .boot-footer-label {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    #errBox {
      display: none;
      margin-top: 0.75rem;
      width: min(28rem, 100%);
      text-align: left;
      background: rgba(127, 29, 29, 0.55);
      border: 1px solid rgba(248, 113, 113, 0.45);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      color: var(--err);
      font-size: 0.85rem;
      line-height: 1.4;
      white-space: pre-wrap;
      max-height: 10rem;
      overflow: auto;
      backdrop-filter: blur(6px);
    }
    #errBox.is-visible { display: block; }
  </style>
</head>
<body>
  <div class="boot-bg" id="bootBg">
    <img id="bootGif" src="../gif.gif" alt="" />
  </div>
  <div class="boot-scrim" aria-hidden="true"></div>
  <div class="wrap">
    <h1>Aurent Restaurant</h1>
    <p id="msg">Запуск<span class="dots"></span></p>
    <div id="errBox" role="alert"></div>
  </div>
  <div class="boot-footer" id="bootFooter">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <span class="boot-footer-label">Загрузка</span>
  </div>
  <script>
    const msgEl = document.getElementById('msg');
    const bootBg = document.getElementById('bootBg');
    const spinner = document.getElementById('spinner');
    const bootFooter = document.getElementById('bootFooter');
    const errBox = document.getElementById('errBox');

    window.__bootMsg = (t) => {
      msgEl.innerHTML = '';
      msgEl.appendChild(document.createTextNode(String(t || 'Запуск')));
      const dots = document.createElement('span');
      dots.className = 'dots';
      msgEl.appendChild(dots);
      errBox.classList.remove('is-visible');
      errBox.textContent = '';
      bootBg.classList.remove('is-hidden');
      spinner.classList.remove('is-hidden');
      bootFooter.style.display = '';
    };

    window.__bootAppend = () => {};

    window.__bootFail = (title, detail) => {
      msgEl.textContent = String(title || 'Не удалось запустить');
      bootBg.classList.add('is-hidden');
      spinner.classList.add('is-hidden');
      bootFooter.style.display = 'none';
      if (detail) {
        errBox.textContent = String(detail).slice(0, 1200);
        errBox.classList.add('is-visible');
      }
    };
  </script>
</body>
</html>
