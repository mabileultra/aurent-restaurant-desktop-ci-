<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurent Restaurant</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 2rem; text-align: center; }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 700; }
    p { margin: 0; color: #94a3b8; font-size: 0.9rem; max-width: 28rem; line-height: 1.45; }
    .log { margin-top: 1.25rem; width: min(36rem, 100%); max-height: 12rem; overflow: auto; text-align: left;
      background: #020617; border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem; font-size: 0.75rem; color: #94a3b8; white-space: pre-wrap; }
    .err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Aurent Restaurant</h1>
    <p id="msg">Запуск локального сервиса зала…</p>
    <div class="log" id="log"></div>
  </div>
  <script>
    const logEl = document.getElementById('log');
    const msgEl = document.getElementById('msg');
    window.__bootAppend = (line, isErr) => {
      const span = document.createElement('div');
      if (isErr) span.className = 'err';
      span.textContent = line;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    };
    window.__bootMsg = (t) => { msgEl.textContent = t; };
  </script>
</body>
</html>
