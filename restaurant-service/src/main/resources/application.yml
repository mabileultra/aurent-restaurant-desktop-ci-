server:
  port: ${RESTAURANT_SERVER_PORT:8087}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: restaurant-service
  datasource:
    url: ${RESTAURANT_DB_URL:jdbc:postgresql://localhost:5439/restaurant_db}
    username: ${RESTAURANT_DB_USERNAME:restaurant_user}
    password: ${RESTAURANT_DB_PASSWORD:restaurant_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-32-chars-for-hs256!!}
  gateway:
    context-secret: ${GATEWAY_CONTEXT_SECRET:}
  pos:
    enabled: ${POS_STOCK_CONSUME_ENABLED:true}
    base-url: ${POS_CORE_URL:http://localhost:8080/api/v1}
    internal-api-key: ${POS_INTERNAL_API_KEY:pos-internal-dev-key-change-in-prod}
  kafka:
    enabled: ${DOMAIN_KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    send-timeout-ms: 10000
    retry-ms: 30000
  restaurant:
    redis:
      enabled: ${RESTAURANT_REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${RESTAURANT_REDIS_DB:2}
      connect-timeout-ms: ${RESTAURANT_REDIS_CONNECT_TIMEOUT_MS:100}
      command-timeout-ms: ${RESTAURANT_REDIS_COMMAND_TIMEOUT_MS:100}
      menu-ttl-seconds: ${RESTAURANT_REDIS_MENU_TTL_SECONDS:600}
      floor-ttl-seconds: ${RESTAURANT_REDIS_FLOOR_TTL_SECONDS:3}
      kitchen-board-ttl-seconds: ${RESTAURANT_REDIS_KITCHEN_BOARD_TTL_SECONDS:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.pos.restaurant: INFO
