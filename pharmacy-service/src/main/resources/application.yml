server:
  port: ${PHARMACY_SERVER_PORT:8089}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: pharmacy-service
  datasource:
    url: ${PHARMACY_DB_URL:jdbc:postgresql://localhost:5441/pharmacy_db}
    username: ${PHARMACY_DB_USERNAME:pharmacy_user}
    password: ${PHARMACY_DB_PASSWORD:pharmacy_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 80MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-32-chars-for-hs256!!}
  gateway:
    context-secret: ${GATEWAY_CONTEXT_SECRET:}
  migration:
    pos-core-datasource-url: ${POS_CORE_DATASOURCE_URL:}
    pos-core-datasource-username: ${POS_CORE_DATASOURCE_USERNAME:pos_user}
    pos-core-datasource-password: ${POS_CORE_DATASOURCE_PASSWORD:pos_password}
  kafka:
    enabled: ${DOMAIN_KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    send-timeout-ms: ${KAFKA_SEND_TIMEOUT_MS:10000}
    retry-ms: ${KAFKA_OUTBOX_RETRY_MS:30000}
  pos-core:
    base-url: ${POS_CORE_URL:http://localhost:8080/api/v1}
    internal-api-key: ${POS_INTERNAL_API_KEY:pos-internal-dev-key-change-in-prod}
  pharmacy:
    redis:
      enabled: ${PHARMACY_REDIS_ENABLED:false}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${PHARMACY_REDIS_DB:0}
      connect-timeout-ms: ${PHARMACY_REDIS_CONNECT_TIMEOUT_MS:100}
      command-timeout-ms: ${PHARMACY_REDIS_COMMAND_TIMEOUT_MS:100}
      barcode-ttl-seconds: ${PHARMACY_REDIS_BARCODE_TTL_SECONDS:180}
    mark-withdraw:
      retry-ms: ${PHARMACY_MARK_WITHDRAW_RETRY_MS:30000}
    tasnif:
      enabled: ${PHARMACY_TASNIF_ENABLED:true}
      base-url: ${PHARMACY_TASNIF_BASE_URL:https://tasnif.soliq.uz/api/cl-api}
      connect-timeout-ms: ${PHARMACY_TASNIF_CONNECT_TIMEOUT_MS:8000}
      read-timeout-ms: ${PHARMACY_TASNIF_READ_TIMEOUT_MS:15000}
      search-type: 1
      default-lang: uz
    async:
      mark-verify:
        core-pool-size: ${PHARMACY_MARK_VERIFY_CORE:8}
        max-pool-size: ${PHARMACY_MARK_VERIFY_MAX:8}
        queue-capacity: ${PHARMACY_MARK_VERIFY_QUEUE:200}
        thread-name-prefix: pharm-mark-verify-
      mark-withdraw:
        core-pool-size: ${PHARMACY_MARK_WITHDRAW_CORE:4}
        max-pool-size: ${PHARMACY_MARK_WITHDRAW_MAX:8}
        queue-capacity: ${PHARMACY_MARK_WITHDRAW_QUEUE:500}
        thread-name-prefix: pharm-mark-withdraw-
      import-pool:
        core-pool-size: ${PHARMACY_IMPORT_CORE:8}
        max-pool-size: ${PHARMACY_IMPORT_MAX:8}
        queue-capacity: ${PHARMACY_IMPORT_QUEUE:100}
        thread-name-prefix: pharm-import-
      catalog:
        core-pool-size: ${PHARMACY_CATALOG_CORE:4}
        max-pool-size: ${PHARMACY_CATALOG_MAX:8}
        queue-capacity: ${PHARMACY_CATALOG_QUEUE:100}
        thread-name-prefix: pharm-catalog-

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.pos.pharmacy: INFO
