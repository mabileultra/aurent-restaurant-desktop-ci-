server:
  port: ${CRM_SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: crm-service
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5438/crm_db}
    username: ${CRM_DB_USERNAME:crm_user}
    password: ${CRM_DB_PASSWORD:crm_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-32-chars-for-hs256!!}
  gateway:
    context-secret: ${GATEWAY_CONTEXT_SECRET:}
  internal:
    api-key: ${CRM_INTERNAL_API_KEY:crm-internal-dev-key-change-in-prod}
  pos-core:
    url: ${POS_CORE_URL:http://localhost:8080/api/v1}
    connect-timeout-ms: ${POS_CORE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${POS_CORE_READ_TIMEOUT_MS:15000}
  migration:
    pos-core-datasource-url: ${POS_CORE_DATASOURCE_URL:}
    pos-core-datasource-username: ${POS_CORE_DATASOURCE_USERNAME:pos_user}
    pos-core-datasource-password: ${POS_CORE_DATASOURCE_PASSWORD:pos_password}
  orders:
    upload-dir: ${ORDERS_UPLOAD_DIR:uploads/orders}

resilience4j:
  circuitbreaker:
    instances:
      pos-core:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      pos-core:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.pos.crm: INFO
