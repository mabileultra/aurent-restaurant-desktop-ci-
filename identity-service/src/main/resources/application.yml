server:
  port: ${IDENTITY_SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5435/identity_db}
    username: ${IDENTITY_DB_USERNAME:identity_user}
    password: ${IDENTITY_DB_PASSWORD:identity_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:change-me-use-at-least-32-chars-for-hs256!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  security:
    login-rate-limit-enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:15}
  internal:
    api-key: ${IDENTITY_INTERNAL_API_KEY:identity-internal-dev-key-change-in-prod}
  pos-core:
    url: ${POS_CORE_URL:http://localhost:8080/api/v1}
    connect-timeout-ms: ${POS_CORE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${POS_CORE_READ_TIMEOUT_MS:15000}
  migration:
    pos-core-datasource-url: ${POS_CORE_DATASOURCE_URL:}
    pos-core-datasource-username: ${POS_CORE_DATASOURCE_USERNAME:pos_user}
    pos-core-datasource-password: ${POS_CORE_DATASOURCE_PASSWORD:pos_password}

resilience4j:
  circuitbreaker:
    instances:
      pos-core:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.pos.identity.exception.BadRequestException
  retry:
    instances:
      pos-core:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.pos.identity.exception.BadRequestException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.pos.identity: INFO

# Sentry disabled when SENTRY_DSN is empty (no behavior change in dev/local).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.05}
