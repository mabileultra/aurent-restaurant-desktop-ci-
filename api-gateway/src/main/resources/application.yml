server:
  port: ${GATEWAY_SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
  gateway:
    context-secret: ${GATEWAY_CONTEXT_SECRET:}

spring:
  application:
    name: api-gateway
  codec:
    # Pharmacy Excel import match/confirm can exceed 16MB on 500–1000-line invoices.
    max-in-memory-size: 64MB
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 180s
      routes:
        # Типы бизнеса компании — web-backend (не platform-service).
        - id: pos-company-business-types
          uri: ${POS_BACKEND_URL:http://127.0.0.1:8080}
          predicates:
            - Path=/api/v1/company-business-types, /api/v1/admin/companies/*/business-types
          order: 0
          filters:
            - PreserveHostHeader

        # Детали документов долгов — данные из pos_db (остаётся в web-backend).
        - id: finance-debt-documents
          uri: ${POS_BACKEND_URL:http://127.0.0.1:8080}
          predicates:
            - Path=/api/v1/finance/debts/documents/**
          order: 0
          filters:
            - PreserveHostHeader

        # UI finance API — напрямую в finance-service.
        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/finance/**
          order: 2
          filters:
            - PreserveHostHeader

        # Auth, пользователи и platform admin в identity — identity-service.
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/platform/module-access/**, /api/v1/platform/security/super-admins/**, /api/v1/platform/account/**
          order: 1
          filters:
            - PreserveHostHeader

        # Finance-sync admin — web-backend (данные outbox/backfill в pos_db).
        - id: finance-sync-admin
          uri: ${POS_BACKEND_URL:http://127.0.0.1:8080}
          predicates:
            - Path=/api/v1/admin/finance-sync/**
          order: 0
          filters:
            - PreserveHostHeader

        # Desktop cashier server-setup password — web-backend (не platform /public/**).
        - id: public-cashier-backend
          uri: ${POS_BACKEND_URL:http://127.0.0.1:8080}
          predicates:
            - Path=/api/v1/public/cashier/**
          order: 0
          filters:
            - PreserveHostHeader

        # Компании, platform UI и публичные заявки — platform-service.
        - id: platform-service
          uri: ${PLATFORM_SERVICE_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/companies/**, /api/v1/platform/**, /api/v1/billing/**, /api/v1/public/**
          order: 1
          filters:
            - PreserveHostHeader

        # Reporting API — reporting-service (Kafka read-model + POS internal clients).
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:http://127.0.0.1:8085}
          predicates:
            - Path=/api/v1/reports/**, /api/v1/admin/reporting-sync/**
          order: 2
          filters:
            - PreserveHostHeader

        # AI Assistant — ai-service.
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://127.0.0.1:8086}
          predicates:
            - Path=/api/v1/ai/**
          order: 2
          filters:
            - PreserveHostHeader

        # Клиенты и заказы клиентов (доставка) — crm-service.
        - id: crm-service
          uri: ${CRM_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/v1/customers/**, /api/v1/orders/**
          order: 2
          filters:
            - PreserveHostHeader

        # Ресторанный POS — restaurant-service (не web-backend /restaurant).
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URL:http://127.0.0.1:8087}
          predicates:
            - Path=/api/v1/rst/**
          order: 2
          filters:
            - PreserveHostHeader

        # Аптека — pharmacy-service (не web-backend /warehouse/pharmacy).
        # Legacy /api/v1/warehouse/pharmacy/** → 410 Gone (LegacyPharmacyGoneConfig).
        - id: pharmacy-service
          uri: ${PHARMACY_SERVICE_URL:http://127.0.0.1:8089}
          predicates:
            - Path=/api/v1/pharmacy/**
          order: 2
          filters:
            - PreserveHostHeader

        # Всё остальное — web-backend (касса, склад).
        - id: pos-backend
          uri: ${POS_BACKEND_URL:http://127.0.0.1:8080}
          predicates:
            - Path=/api/v1/**
          order: 10
          filters:
            - PreserveHostHeader

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
